<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PageChat · Settings</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="wrap">
      <header>
          <span class="seal">P</span>
        <div>
          <h1>PageChat settings</h1>
          <p>No API key needed. Chats stay on this computer.</p>
        </div>
      </header>

      <form id="form">
        <label>
          Temperature <span id="tempLabel">0.7</span>
          <input id="temperature" name="temperature" type="range" min="0" max="1.5" step="0.1" />
        </label>

        <label>
          Max page characters
          <input id="maxPageChars" name="maxPageChars" type="number" min="2000" max="32000" step="1000" />
        </label>

        <label>
          Max pages when summarizing a site
          <input id="maxSitePages" name="maxSitePages" type="number" min="3" max="20" step="1" />
        </label>

        <label class="check">
          <input id="includePageByDefault" name="includePageByDefault" type="checkbox" />
          Start in page mode (include the current tab). Turn off for chat-only by default.
        </label>

        <div class="actions">
          <button type="submit" class="primary">Save</button>
        </div>
        <p class="status" id="status" hidden></p>
      </form>
    </main>
    <script src="options.js"></script>
  </body>
</html>
