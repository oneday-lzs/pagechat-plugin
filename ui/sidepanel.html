<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PageChat</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body class="chat-mode">
    <div class="app">
      <header class="top">
        <button class="icon-btn" id="historyBtn" type="button" aria-label="Chats" title="Chats">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 7h14M5 12h14M5 17h9" />
          </svg>
        </button>
        <div class="brand">
          <span class="seal" aria-hidden="true">P</span>
          <div>
            <strong>PageChat</strong>
            <small id="subtitle">Chat</small>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="newBtn" type="button" aria-label="New chat" title="New chat">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
          <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
            </svg>
          </button>
        </div>
      </header>

      <div class="page-chip" id="pageChip" hidden>
        <span class="dot"></span>
        <span id="pageChipText">No page connected</span>
        <button type="button" id="siteBtn">Summarize site</button>
        <button type="button" id="refreshPageBtn">Refresh</button>
      </div>

      <main class="thread" id="thread" aria-live="polite"></main>

      <section class="composer">
        <div class="quick page-only" id="pageQuick">
          <button type="button" data-quick="site">Summarize site</button>
          <button type="button" data-quick="company">Company info</button>
          <button type="button" data-quick="summarize">Summarize page</button>
          <button type="button" data-agent="translate">Translate</button>
        </div>
        <div class="quick chat-only" id="chatQuick">
          <button type="button" data-quick="chat-write">Help me write</button>
          <button type="button" data-quick="chat-explain">Explain</button>
          <button type="button" data-quick="chat-code">Write code</button>
          <button type="button" data-quick="chat-plan">Make a plan</button>
          <button type="button" data-agent="translate">Translate</button>
        </div>
        <div class="quick translate-only" id="translateQuick">
          <button type="button" data-agent="chat">Chat</button>
          <button type="button" data-quick="tr-zh">To Chinese</button>
          <button type="button" data-quick="tr-en">To English</button>
          <button type="button" data-quick="tr-page-zh">This page → 中文</button>
          <button type="button" data-quick="tr-page-en">This page → English</button>
        </div>
          <div class="box">
          <textarea
            id="input"
            rows="1"
            placeholder="Message PageChat"
          ></textarea>
          <div class="attach-list" id="attachList" hidden></div>
          <div class="box-bar">
            <label class="toggle">
              <input type="checkbox" id="includePage" />
              <span>Include this page</span>
            </label>
            <button type="button" class="attach-btn" id="attachBtn" hidden aria-hidden="true" tabindex="-1">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21.4 11.2 12.6 20a5 5 0 0 1-7.1-7.1l9.5-9.5a3.2 3.2 0 0 1 4.5 4.5l-9.5 9.4a1.4 1.4 0 1 1-2-2l8.1-8.1" />
              </svg>
            </button>
            <input id="fileInput" type="file" hidden multiple accept="image/*,.txt,.md,.csv,.json,.xml,.html,.css,.js,.ts,.py,.log,.pdf" />
            <span class="box-grow"></span>
            <button type="button" class="send stop-fab" id="stopBtn" hidden aria-label="Stop">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="6" y="6" width="12" height="12" rx="2" />
              </svg>
            </button>
            <button type="button" class="send" id="sendBtn" aria-label="Send">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 19V5M5 12l7-7 7 7" />
              </svg>
            </button>
          </div>
        </div>
      </section>
    </div>

    <aside class="drawer" id="drawer" hidden>
      <div class="drawer-panel">
        <div class="drawer-head">
          <h2>Chats</h2>
          <button class="icon-btn" id="closeDrawerBtn" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
        <div class="conv-list" id="convList"></div>
        <div class="drawer-foot">
          <button type="button" id="exportBtn">Export chat</button>
          <button type="button" class="danger-text" id="clearBtn">Clear all</button>
        </div>
      </div>
    </aside>

    <div class="toast" id="toast" hidden></div>
    <script src="sidepanel.js"></script>
  </body>
</html>
